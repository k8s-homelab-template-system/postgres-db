{{- /*
Secret chứa credential của PostgreSQL, chart bitnami/postgresql đọc qua
postgresql.auth.existingSecret.
Giá trị sinh ngẫu nhiên một lần rồi giữ nguyên khi upgrade (lookup Secret đang có,
hoặc Secret cũ <release>-postgresql do chart bitnami tạo trước đây, để khớp mật khẩu
đã lưu trong dữ liệu trên PVC).
Tắt authSecret.create nếu Secret được quản lý bên ngoài (kubectl, Sealed Secrets, External Secrets...).
*/ -}}
{{- if .Values.authSecret.create }}
{{- $name := tpl .Values.postgresql.auth.existingSecret . }}
{{- $legacy := printf "%s-postgresql" .Release.Name }}
{{- $postgresPassword := include "homelab.postgres-db.storedCredential" (dict "secret" $name "legacySecret" $legacy "key" "postgres-password" "context" $) | default (randAlphaNum 24) }}
{{- $password := include "homelab.postgres-db.storedCredential" (dict "secret" $name "legacySecret" $legacy "key" "password" "context" $) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Giữ Secret khi gỡ release để cài lại vẫn dùng đúng mật khẩu với dữ liệu trên PVC.
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ $postgresPassword | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
{{- end }}
