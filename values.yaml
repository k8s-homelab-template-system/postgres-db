# Giá trị truyền xuống chart bitnami/postgresql.
# Xem đầy đủ: https://artifacthub.io/packages/helm/bitnami/postgresql?modal=values
postgresql:
  architecture: standalone

  auth:
    database: app
    username: app
    # Để trống thì chart tự sinh mật khẩu và lưu vào Secret.
    # Nên trỏ tới Secret có sẵn để mật khẩu không đổi khi upgrade:
    # existingSecret: postgres-db-auth

  primary:
    persistence:
      size: 5Gi
      # Để trống = dùng StorageClass mặc định của cluster.
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  metrics:
    enabled: false
