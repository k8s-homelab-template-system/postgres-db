# Giá trị truyền xuống chart bitnami/postgresql.
# Xem đầy đủ: https://artifacthub.io/packages/helm/bitnami/postgresql?modal=values
postgresql:
  architecture: standalone

  auth:
    database: app
    username: app
    # Mật khẩu nằm trong Secret <release>-postgresql-auth (xem authSecret ở cuối file).
    existingSecret: '{{ .Release.Name }}-postgresql-auth'
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
    # Không ghi mật khẩu vào đây: giá trị được đọc từ Secret đang có trong cluster lúc deploy.
    # Chart bitnami bắt buộc biết mật khẩu hiện tại khi upgrade (PASSWORDS ERROR), kể cả khi
    # dùng existingSecret mà Secret đó chưa tồn tại (lần đầu chuyển từ Secret <release>-postgresql).
    password: '{{ include "homelab.postgres-db.storedCredential" (dict "secret" (tpl .Values.auth.existingSecret .) "legacySecret" (printf "%s-postgresql" .Release.Name) "key" "password" "context" .) }}'

  primary:
    persistence:
      size: 5Gi
      # Để trống = dùng StorageClass mặc định của cluster.
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  metrics:
    enabled: false

# Secret credential do chart này tạo (templates/auth-secret.yaml), tên lấy từ
# postgresql.auth.existingSecret. Key: postgres-password (user postgres), password (user app).
# create: false nếu tự quản lý Secret đó (tạo bằng kubectl, Sealed Secrets, External Secrets...).
authSecret:
  create: true
