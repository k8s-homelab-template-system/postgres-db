# Giá trị truyền xuống chart cnpg/cluster.
# Xem đầy đủ: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/values.yaml
cluster:
  type: postgresql
  mode: standalone
  version:
    postgresql: "17"

  cluster:
    # Homelab: 1 instance là đủ. Tăng lên 3 nếu có nhiều node.
    instances: 1
    storage:
      size: 5Gi
      # Để trống = dùng StorageClass mặc định của cluster.
      storageClass: ""
    # Tắt PDB khi chỉ có 1 instance, nếu không sẽ chặn drain node.
    enablePDB: false
    enableSuperuserAccess: false
    initdb:
      database: app
      owner: app
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    monitoring:
      enabled: false

  backups:
    enabled: false
